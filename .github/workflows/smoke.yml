name: smoke

on: [push, pull_request]

jobs:
  smoke:
    strategy:
      fail-fast: false  # a Windows failure should not hide the Linux result
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python tests/smoke.py
